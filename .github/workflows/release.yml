# Publishes a release when a version tag is pushed: the binaries, their checksums and the installer.
# `install.sh` downloads from "releases/latest", so a published release is what users get.
# A tag with a suffix (`v0.22.0-beta.1`) is a pre-release: `src/version.ts` says 0.22.0, the build adds the
# suffix, GitHub marks it so — "releases/latest" skips it, and only servers on the beta channel are offered it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: The tag must match the version in the code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="v$(bun src/index.ts version)"
          case "$GITHUB_REF_NAME" in
            "$code") ;;
            "$code"-*)
              if gh release view "$code" >/dev/null 2>&1; then
                echo "$code is out already: a pre-release of it would be older than it" >&2
                exit 1
              fi
              echo "HATA_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
              echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Tag $GITHUB_REF_NAME does not match src/version.ts ($code, or $code-<suffix> for a pre-release)" >&2
              exit 1
              ;;
          esac

      # The notes of a release are the message of its tag below the first line: what was done, in short.
      # The checkout leaves the tag pointing at the commit, so the tag itself is fetched again.
      - name: Release notes from the tag
        run: |
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents:body)' "refs/tags/$GITHUB_REF_NAME" > notes.md
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ] || ! grep -q '[^[:space:]]' notes.md; then
            echo "Tag $GITHUB_REF_NAME has no notes: make it with git tag -a and say what was done" >&2
            exit 1
          fi
          cat notes.md

      - run: bun test

      - run: bun run build

      - name: Checksums
        working-directory: dist
        run: sha256sum hata-linux-x64 hata-linux-arm64 hata-client-linux-x64 hata-client-linux-arm64 > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hata-linux-x64 dist/hata-linux-arm64 dist/hata-client-linux-x64 dist/hata-client-linux-arm64 dist/SHA256SUMS install.sh \
            --title "Hata ${GITHUB_REF_NAME#v}" --notes-file notes.md $PRERELEASE
