# Publishes a release when a version tag is pushed: the binaries, their checksums and the installer.
# `install.sh` downloads from "releases/latest", so a published release is what users get.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: The tag must match the version in the code
        run: |
          code="v$(bun src/index.ts version)"
          if [ "$code" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/version.ts ($code)" >&2
            exit 1
          fi

      # The notes of a release are the message of its tag below the first line: what was done, in short.
      # The checkout leaves the tag pointing at the commit, so the tag itself is fetched again.
      - name: Release notes from the tag
        run: |
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents:body)' "refs/tags/$GITHUB_REF_NAME" > notes.md
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ] || ! grep -q '[^[:space:]]' notes.md; then
            echo "Tag $GITHUB_REF_NAME has no notes: make it with git tag -a and say what was done" >&2
            exit 1
          fi
          cat notes.md

      - run: bun test

      - run: bun run build

      - name: Checksums
        working-directory: dist
        run: sha256sum hata-linux-x64 hata-linux-arm64 > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hata-linux-x64 dist/hata-linux-arm64 dist/SHA256SUMS install.sh \
            --title "Hata ${GITHUB_REF_NAME#v}" --notes-file notes.md
